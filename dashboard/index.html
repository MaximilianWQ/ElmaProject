<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for the iOS notch. Zoom is deliberately NOT
         disabled: user-scalable=no breaks pinch-zoom for anyone who needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBF9" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="manifest" href="/dashboard/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg" />
    <link rel="apple-touch-icon" href="/dashboard/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ELMA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ELMA Admin" />
    <title>ELMA · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Urbanist is the display face; JetBrains Mono carries ids and logs.
         Geist / Inter stay in the stack as fallbacks if the CDN is blocked. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
