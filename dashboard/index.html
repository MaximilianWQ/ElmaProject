<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for the iOS notch. Zoom is deliberately NOT
         disabled: user-scalable=no breaks pinch-zoom for anyone who needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8FB" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="manifest" href="/dashboard/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg" />
    <link rel="apple-touch-icon" href="/dashboard/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ELMA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ELMA Admin" />
    <title>ELMA · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Golos Text: drawn for Cyrillic first, which is the whole interface here.
         Inter stays as the fallback if Google Fonts is blocked. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap&subset=cyrillic,latin"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
